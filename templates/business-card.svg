<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hierarchy Technologies — Business card master
  Standard 85 × 55 mm (3.346" × 2.165") with 3 mm bleed.
  Two artboards stacked: front (white) + back (gradient).

  ⚠ The H mark path is defined ONCE as a <symbol> below and <use>d twice.
     If the canonical mark ever changes, copy the new path from
     `logos/hierarchy-mark.svg` (the path inside <path d="…"/>) and replace
     the d="…" attribute on #ht-mark.

  PRINT: Open in Illustrator → CMYK → File → Save As PDF/X-1a.
         Replace [BRACKET] placeholders before exporting.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="91mm" height="125mm"
     viewBox="0 0 910 1250"
     font-family="Inter, system-ui, sans-serif">

  <defs>
    <linearGradient id="bc-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#4261AD"/>
      <stop offset=".5"  stop-color="#392F8E"/>
      <stop offset="1"   stop-color="#482D89"/>
    </linearGradient>

    <!-- Canonical H mark — copy of `logos/hierarchy-mark.svg` path -->
    <symbol id="ht-mark" viewBox="170 275 260 296">
      <path d="M348.5,312.09h17.5v98.56h-141.7v-98.56h17.5v81.06h106.7v-81.06ZM366.05,312.04h-17.6v81.06h-106.6v-81.06h-17.6v98.66h141.8v-98.66ZM224.35,312.14h17.4v81.06h106.8v-81.06h17.4v98.46h-141.6v-98.46ZM241.8,435.22h-17.5v110.56h17.5v-93.06h106.7v64.93h17.5v-82.43h-124.2ZM241.85,452.77h106.6v64.93h17.6v-82.53h-141.8v110.66h17.6v-93.06ZM224.35,435.27h141.6v82.33h-17.4v-64.93h-106.8v93.06h-17.4v-110.46ZM200.63,316.62v211.2c6.65,3.25,11.25,10.06,11.25,17.96,0,11.05-8.95,20-20,20s-20-8.95-20-20c0-7.9,4.6-14.72,11.25-17.96v-211.2c-6.65-3.25-11.25-10.06-11.25-17.96,0-11.05,8.95-20,20-20s20,8.95,20,20c0,7.9-4.6,14.72-11.25,17.96ZM183.13,298.65c0,4.83,3.92,8.75,8.75,8.75s8.75-3.92,8.75-8.75-3.92-8.75-8.75-8.75-8.75,3.92-8.75,8.75ZM200.63,545.78c0-4.83-3.92-8.75-8.75-8.75s-8.75,3.92-8.75,8.75,3.92,8.75,8.75,8.75,8.75-3.92,8.75-8.75ZM418.42,545.78c0,11.05-8.95,20-20,20s-20-8.95-20-20c0-7.9,4.6-14.72,11.25-17.96v-211.2c-6.65-3.25-11.25-10.06-11.25-17.96,0-11.05,8.95-20,20-20s20,8.95,20,20c0,7.9-4.6,14.72-11.25,17.96v211.2c6.65,3.25,11.25,10.06,11.25,17.96ZM389.67,298.65c0,4.83,3.92,8.75,8.75,8.75s8.75-3.92,8.75-8.75-3.92-8.75-8.75-8.75-8.75,3.92-8.75,8.75ZM407.17,545.78c0-4.83-3.92-8.75-8.75-8.75s-8.75,3.92-8.75,8.75,3.92,8.75,8.75,8.75,8.75-3.92,8.75-8.75Z"/>
    </symbol>
  </defs>

  <!-- ========== FRONT (white card, top) ========== -->
  <g id="front">
    <rect x="0" y="0" width="910" height="610" fill="#FFFFFF"/>

    <use href="#ht-mark" x="60" y="50" width="100" height="115" fill="url(#bc-gradient)"/>

    <!-- Person info -->
    <text x="60" y="380" font-family="Sora, Inter, sans-serif" font-size="42" font-weight="700" fill="#231F20" letter-spacing="-0.5">[FULL NAME]</text>
    <text x="60" y="425" font-size="22" font-weight="500" fill="#3F3F46">[ROLE / TITLE]</text>

    <!-- Contact -->
    <g font-size="20" fill="#3F3F46">
      <text x="60" y="500">[email@hierarchy.tech]</text>
      <text x="60" y="535">[+1 555 0100]</text>
      <text x="60" y="570">hierarchy.tech</text>
    </g>

    <!-- Safety guide (delete before export) -->
    <rect x="30" y="30" width="850" height="550" fill="none" stroke="#D4D4D8" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- artboard separator (visual aid only) -->
  <rect x="0" y="610" width="910" height="20" fill="#FAFAFA"/>

  <!-- ========== BACK (gradient card, bottom) ========== -->
  <g id="back" transform="translate(0, 630)">
    <rect x="0" y="0" width="910" height="610" fill="url(#bc-gradient)"/>

    <!-- Subtle grid overlay -->
    <g opacity="0.08" fill="#FFFFFF">
      <rect x="0"   y="60"  width="910" height="0.5"/>
      <rect x="0"   y="180" width="910" height="0.5"/>
      <rect x="0"   y="300" width="910" height="0.5"/>
      <rect x="0"   y="420" width="910" height="0.5"/>
      <rect x="0"   y="540" width="910" height="0.5"/>
      <rect x="80"  y="0"   width="0.5" height="610"/>
      <rect x="220" y="0"   width="0.5" height="610"/>
      <rect x="360" y="0"   width="0.5" height="610"/>
      <rect x="500" y="0"   width="0.5" height="610"/>
      <rect x="640" y="0"   width="0.5" height="610"/>
      <rect x="780" y="0"   width="0.5" height="610"/>
    </g>

    <use href="#ht-mark" x="335" y="140" width="240" height="280" fill="#FFFFFF"/>

    <!-- Tagline -->
    <text x="455" y="490" text-anchor="middle" fill="#FFFFFF" font-family="Sora, Inter, sans-serif" font-weight="600" font-size="20" letter-spacing="3">HIERARCHY · TECHNOLOGIES</text>
    <text x="455" y="525" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="14" letter-spacing="1.5">ENGINEERED SYSTEMS FOR OPERATORS</text>

    <!-- Safety guide -->
    <rect x="30" y="30" width="850" height="550" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="4 4"/>
  </g>
</svg>
