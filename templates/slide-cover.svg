<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hierarchy Technologies — Slide deck cover (16:9, 1920×1080)
  Use as the cover slide for Keynote / Google Slides / PowerPoint.
  Replace [DECK TITLE] / [SUBTITLE] / [PRESENTER · DATE] before exporting.
  Export to PNG @ 1× for embed, or keep as SVG and resize freely in vector tools.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     font-family="'Sora','Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="sl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#4261AD"/>
      <stop offset="0.5" stop-color="#392F8E"/>
      <stop offset="1"   stop-color="#482D89"/>
    </linearGradient>
    <radialGradient id="sl-glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Canonical H mark — copy of `logos/hierarchy-mark.svg` path -->
    <symbol id="ht-mark" viewBox="170 275 260 296">
      <path d="M348.5,312.09h17.5v98.56h-141.7v-98.56h17.5v81.06h106.7v-81.06ZM366.05,312.04h-17.6v81.06h-106.6v-81.06h-17.6v98.66h141.8v-98.66ZM224.35,312.14h17.4v81.06h106.8v-81.06h17.4v98.46h-141.6v-98.46ZM241.8,435.22h-17.5v110.56h17.5v-93.06h106.7v64.93h17.5v-82.43h-124.2ZM241.85,452.77h106.6v64.93h17.6v-82.53h-141.8v110.66h17.6v-93.06ZM224.35,435.27h141.6v82.33h-17.4v-64.93h-106.8v93.06h-17.4v-110.46ZM200.63,316.62v211.2c6.65,3.25,11.25,10.06,11.25,17.96,0,11.05-8.95,20-20,20s-20-8.95-20-20c0-7.9,4.6-14.72,11.25-17.96v-211.2c-6.65-3.25-11.25-10.06-11.25-17.96,0-11.05,8.95-20,20-20s20,8.95,20,20c0,7.9-4.6,14.72-11.25,17.96ZM183.13,298.65c0,4.83,3.92,8.75,8.75,8.75s8.75-3.92,8.75-8.75-3.92-8.75-8.75-8.75-8.75,3.92-8.75,8.75ZM200.63,545.78c0-4.83-3.92-8.75-8.75-8.75s-8.75,3.92-8.75,8.75,3.92,8.75,8.75,8.75,8.75-3.92,8.75-8.75ZM418.42,545.78c0,11.05-8.95,20-20,20s-20-8.95-20-20c0-7.9,4.6-14.72,11.25-17.96v-211.2c-6.65-3.25-11.25-10.06-11.25-17.96,0-11.05,8.95-20,20-20s20,8.95,20,20c0,7.9-4.6,14.72-11.25,17.96v211.2c6.65,3.25,11.25,10.06,11.25,17.96ZM389.67,298.65c0,4.83,3.92,8.75,8.75,8.75s8.75-3.92,8.75-8.75-3.92-8.75-8.75-8.75-8.75,3.92-8.75,8.75ZM407.17,545.78c0-4.83-3.92-8.75-8.75-8.75s-8.75,3.92-8.75,8.75,3.92,8.75,8.75,8.75,8.75-3.92,8.75-8.75Z"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#sl-bg)"/>
  <rect width="1920" height="1080" fill="url(#sl-glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 120  H1920"/><path d="M0 240 H1920"/><path d="M0 360 H1920"/>
    <path d="M0 480  H1920"/><path d="M0 600 H1920"/><path d="M0 720 H1920"/>
    <path d="M0 840  H1920"/><path d="M0 960 H1920"/>
    <path d="M120  0 V1080"/><path d="M240  0 V1080"/><path d="M360 0 V1080"/>
    <path d="M480  0 V1080"/><path d="M600  0 V1080"/><path d="M720 0 V1080"/>
    <path d="M840  0 V1080"/><path d="M960  0 V1080"/><path d="M1080 0 V1080"/>
    <path d="M1200 0 V1080"/><path d="M1320 0 V1080"/><path d="M1440 0 V1080"/>
    <path d="M1560 0 V1080"/><path d="M1680 0 V1080"/><path d="M1800 0 V1080"/>
  </g>

  <!-- White H mark — referenced from <symbol> defined above -->
  <use href="#ht-mark" x="120" y="120" width="120" height="140" fill="#FFFFFF"/>

  <!-- Eyebrow -->
  <text x="120" y="540" fill="rgba(255,255,255,0.85)" font-size="20" font-weight="600" letter-spacing="6">HIERARCHY · TECHNOLOGIES</text>

  <!-- Title -->
  <text x="120" y="640" fill="#FFFFFF" font-size="96" font-weight="700" letter-spacing="-2">[DECK TITLE]</text>
  <text x="120" y="750" fill="#FFFFFF" font-size="96" font-weight="700" letter-spacing="-2">— line two if needed.</text>

  <!-- Subtitle -->
  <text x="120" y="830" fill="rgba(255,255,255,0.75)" font-size="32" font-weight="400">[Optional one-line subtitle.]</text>

  <!-- Footer block -->
  <rect x="0" y="1000" width="1920" height="1" fill="rgba(255,255,255,0.18)"/>
  <text x="120" y="1040" fill="rgba(255,255,255,0.85)" font-size="20" font-weight="500">[PRESENTER NAME]</text>
  <text x="120" y="1066" fill="rgba(255,255,255,0.55)" font-size="16">[ROLE] · [YYYY-MM-DD]</text>
  <text x="1800" y="1040" text-anchor="end" fill="rgba(255,255,255,0.85)" font-size="20" font-weight="500">hierarchy.tech</text>
  <text x="1800" y="1066" text-anchor="end" fill="rgba(255,255,255,0.55)" font-size="16">Confidential · Internal use</text>
</svg>
